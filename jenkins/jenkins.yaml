# Block 22 — Jenkins Configuration as Code (plugin: configuration-as-code)
# Load via: Manage Jenkins -> System -> Configuration as Code -> Path: /var/lib/jenkins/jenkins.yaml
# Secrets come from environment variables, never from this file.
jenkins:
  systemMessage: "Managed by JCasC - do not edit by hand"
  numExecutors: 0                     # controller runs no builds (Block 13)
  quietPeriod: 5
  scmCheckoutRetryCount: 2

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD}"

  authorizationStrategy:
    roleBased:
      roles:
        global:
          - name: "admin"
            description: "Full control"
            permissions: ["Overall/Administer", "Overall/Read"]
            assignments: ["admin"]
          - name: "developer"
            description: "Build and read"
            permissions: ["Overall/Read", "Job/Read", "Job/Build", "Job/Cancel", "Job/Workspace", "View/Read"]
          - name: "readonly"
            description: "Look only"
            permissions: ["Overall/Read", "Job/Read", "View/Read"]
        items:
          - name: "nodejs-team"
            pattern: "nodejs-.*"
            permissions: ["Job/Build", "Job/Cancel", "Job/Configure", "Job/Read", "Job/Workspace"]
          - name: "python-team"
            pattern: "python-.*"
            permissions: ["Job/Build", "Job/Cancel", "Job/Configure", "Job/Read", "Job/Workspace"]

  nodes:
    - permanent:
        name: "linux-1"
        remoteFS: "/home/jenkins/agent"
        numExecutors: 2
        labelString: "linux docker node20 python3"
        launcher:
          ssh:
            host: "10.0.0.11"
            credentialsId: "agent-key"
            hostKeyVerificationStrategy: "nonVerifying"

tool:
  git:
    installations:
      - name: "Default"
        home: "git"
  nodejs:
    installations:
      - name: "node20"
        properties:
          - installSource:
              installers:
                - nodeJSInstaller:
                    id: "20.17.0"
                    npmPackagesRefreshHours: 72

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "dockerhub-creds"
              username: "${DOCKERHUB_USER}"
              password: "${DOCKERHUB_TOKEN}"
              description: "Docker Hub push (use an access token, not the password)"
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: "github-ssh"
              username: "git"
              privateKeySource:
                directEntry:
                  privateKey: "${GITHUB_SSH_KEY}"
              description: "Read-only deploy key for jenkins-zero-to-hero"

unclassified:
  sonarGlobalConfiguration:
    installations:
      - name: "sonar"
        serverUrl: "http://localhost:9000"
        credentialsId: "sonar-token"
  slackNotifier:
    teamDomain: "${SLACK_WORKSPACE}"
    tokenCredentialId: "slack-bot"
    room: "#ci"
